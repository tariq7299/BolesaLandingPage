<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- This my JS of bootstrap that is necessary for bootstrap to work -->
    <script src="./js/bootstrap.js"></script>
    <!-- Iam not the bootstrap/js/... using the file in node_modules folder because in production env you don't want to use any files or code inside you node_modules so instead i have copied the file into my own JS folder-->
    <!-- <script src="../node_modules/bootstrap/dist/js/bootstrap.js"></script> -->

    <!-- This my own compiled sass code also bootstrap compiled sass code as i have @imported bootstrap sass files into main.scss then copiled it to main.css -->
    <!-- I am not linking bootstrap copmpiled sass files from bootstrap/dist/css/node_modules and instead I have @imported the sass files into main.scss (then compiled them to main.css) so i can customize bootstrap default values first  -->
    <link rel="stylesheet" href="./styles/scss/main.css" />
    <!-- This my own JS -->
    <script src="./js/main.js"></script>

    <title>Bolesa</title>
  </head>
  <body>
    <main>
      <section class="tabby-payment-section">
        <div class="section-container tabby-payment-section__section-container">
          <div class="tabby-payment-section__text">
            <div class="tabby-payment-section__header">
              <h2 class="section-title font-secondary-color-2">
                مدفوعات آمنة، لتجارة مستدامة، وثقة متينة
              </h2>
              <p
                class="section-description tabby-payment-section__description font-secondary-color-2"
              >
                استفد من نظام بوليصة المتكامل للمدفوعات الإلكترونية لإدارة
                مدفوعات متجرك وعملائك
              </p>
            </div>
            <div class="tabby-payment-section__benefits">
              <p class="font-secondary-color-4">
                <i class="fa-solid fa-check-to-slot"></i>
                تفعيل سريع لنظام المدفوعات خلال يوم واحد
              </p>
              <p class="font-secondary-color-4">
                <i class="fa-solid fa-check-to-slot"></i>تحصيل المدفوعات بعد 24
                ساعة
              </p>
              <p class="font-secondary-color-4">
                <i class="fa-solid fa-check-to-slot"></i>
                حماية عالية وأمان لكافة عملياتك
              </p>
            </div>
          </div>
          <div class="tabby-payment-section__tabby-img">
            <img class="tabby-tag" src="./assets/tabby-tag.png" alt="" />
            <img
              class="tabby-img"
              src="./assets/tabby-payment.png"
              alt="Tabby Payment Image"
            />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
