<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- This my JS of bootstrap that is necessary for bootstrap to work -->
    <script src="./js/bootstrap.js"></script>
    <!-- Iam not the bootstrap/js/... using the file in node_modules folder because in production env you don't want to use any files or code inside you node_modules so instead i have copied the file into my own JS folder-->
    <!-- <script src="../node_modules/bootstrap/dist/js/bootstrap.js"></script> -->

    <!-- This my own compiled sass code also bootstrap compiled sass code as i have @imported bootstrap sass files into main.scss then copiled it to main.css -->
    <!-- I am not linking bootstrap copmpiled sass files from bootstrap/dist/css/node_modules and instead I have @imported the sass files into main.scss (then compiled them to main.css) so i can customize bootstrap default values first  -->
    <link rel="stylesheet" href="./styles/scss/main.css" />
    <!-- This my own JS -->
    <script src="./js/main.js"></script>

    <title>Bolesa</title>
  </head>
  <body>
    <main>
      <section class="demos-slider-section">
        <div
          class="section-container section-container--card demos-slider-section__container"
        >
          <div class="demos-slider-section__text">
            <h2 class="section-title text--secondary-color-2 text-center">
              خيارات متنوعة لعرض منتجاتك
            </h2>
            <p class="section-description text--secondary-color-2 text--center">
              اختر الثيم الذي يناسب احتياجاتك من خلال خياراتنا المتنوعة
            </p>
          </div>

          <!-- Slider main container -->
          <div class="swiper demos-slider-section__swiper">
            <!-- Additional required wrapper -->
            <div class="swiper-wrapper">
              <!-- Slides -->
              <div class="swiper-slide">
                <img src="./assets/store-prototype-img-1.png" alt="" />
              </div>
              <div class="swiper-slide">
                <img src="./assets/store-prototype-img-1.png" alt="" />
              </div>
              <div class="swiper-slide">
                <img src="./assets/store-prototype-img-1.png" alt="" />
              </div>
              <div class="swiper-slide">
                <img src="./assets/store-prototype-img-1.png" alt="" />
              </div>
              <div class="swiper-slide">
                <img src="./assets/store-prototype-img-1.png" alt="" />
              </div>

              <div
                class="swiper-button-prev swiper-button-prev--secondary-color-2"
              ></div>
              <div
                class="swiper-button-next swiper-button-next--secondary-color-2"
              ></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
